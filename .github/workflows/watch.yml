name: Watch for a table

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub may run these a few minutes late at busy times
  workflow_dispatch:         # "Run workflow" button for a manual check
    inputs:
      date:
        description: "Date(s) to check, YYYY-MM-DD, comma-separated - pick one with free tables to test alerts"
        default: "2026-12-13,2026-12-14"

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check SevenRooms and alert
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          DATES: ${{ inputs.date || '2026-12-13,2026-12-14' }}
        run: python3 dome_watch.py --check
