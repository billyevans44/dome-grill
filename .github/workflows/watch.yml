name: Watch for a table

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub may run these a few minutes late at busy times
  workflow_dispatch:         # "Run workflow" button for a manual check

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check SevenRooms and alert
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python3 dome_watch.py --check
